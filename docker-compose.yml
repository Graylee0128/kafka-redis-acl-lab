# =============================================================================
# Kafka × Redis 整合與 ACL 權限控制 lab
# =============================================================================
#
# 服務一覽：
#   kafka       Kafka broker + controller（KRaft 單節點），常駐
#   kafka-init  一次性初始化：建帳號、topic、ACL，跑完就結束
#   producer    產生訂單事件寫進 Kafka（只有寫入權限）
#   consumer×2  同一個 consumer group 讀 Kafka，寫進 Redis（只有讀取權限）
#   web         權限申請面板（加分題），唯一持有 Kafka / Redis admin 憑證的元件
#   redis       Redis，以 ACL 檔控管帳號
#   kafbat-ui    （選用，--profile ui）Kafka 管理 UI，http://localhost:8081
#   redisinsight （選用，--profile ui）Redis 管理 UI，http://localhost:5540
#
# 啟動順序（depends_on）：
#   kafka ──healthy──► kafka-init ──exit 0──┬──► producer
#                                           ├──► consumer ×2 ◄──healthy── redis
#                                           └──► web         ◄──healthy── redis
#
# 變數：${...} 的值來自同目錄的 .env（cp .env.example .env），三種寫法：
#   ${X:?訊息}  X 沒設定 → compose 直接報錯，一個容器都不建（fail-fast 的第一關）
#   ${X:-預設}  X 沒設定 → 用預設值
#   ${X}        X 沒設定 → 變成空字串，不報錯
#
# 檢視解析結果時用 docker compose config --services / --volumes；
# 不要直接跑 docker compose config，它會把 .env 的密碼全部展開印出來。
#
# 相關說明：QA.md「讀懂執行狀態」與「Kafka 設計」兩節。
# =============================================================================

# 專案名稱。容器、volume、網路名稱都以它為前綴：
#   容器 kafka-redis-lab-kafka-1、volume kafka-redis-lab_kafka-data、網路 kafka-redis-lab_default
# docker compose down -v 只會刪除這個專案底下的東西，不影響同主機上的其他 compose 專案。
name: kafka-redis-lab

# x- 開頭是 compose 的擴充欄位，compose 本身會忽略，用來放共用的值。
# &kafka-image 是 YAML anchor（定義），下面的 *kafka-image 是 alias（引用）。
# kafka 與 kafka-init 必須用同一個版本（CLI 工具要跟 broker 相容），寫在一處就不會只改到一邊。
x-kafka-image: &kafka-image apache/kafka:3.9.1

services:
  # ---------- 基礎設施 ----------
  kafka:
    image: *kafka-image
    # 容器自己的主機名稱。同一個 compose 網路裡，其他容器本來就能用服務名稱 kafka 找到它；
    # 這行讓容器內部也叫 kafka，與 start.sh 的 advertised.listeners=INTERNAL://kafka:9092 一致。
    hostname: kafka
    # 取代 apache/kafka image 原本的 entrypoint（/__cacert_entrypoint.sh → /etc/kafka/docker/run），
    # 改由 start.sh 產生設定、format（含 --add-scram 寫入 admin）、再 exec kafka-server-start.sh。
    entrypoint: ["bash", "/scripts/start.sh"]
    environment:
      # KRaft cluster 識別碼（22 字元 base64 UUID），不是秘密；format 時寫進資料目錄
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:?請先執行 cp .env.example .env}
      # admin 密碼：CONTROLLER 的 PLAIN、INTERNAL 的 SCRAM、format 時的 --add-scram 都用它
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?請先執行 cp .env.example .env}
    # 沒有設定 restart（預設 "no"）：主機重開機後不會自動啟動，要手動 docker compose up -d。
    ports:
      # 格式「host IP:host port:容器 port」。只綁 127.0.0.1，只有本機連得到，區網其他電腦連不到。
      # 只 publish EXTERNAL（9094）；INTERNAL 9092 沒寫在這裡，host 完全連不到（容器之間不受影響）。
      # 9093（CONTROLLER）只綁容器內的 localhost，連其他容器都到不了。
      - "127.0.0.1:9094:9094"   # EXTERNAL listener，只開給本機除錯
    volumes:
      # bind mount：把 host 上的腳本掛進容器；:ro 唯讀，容器改不了它
      - ./infra/kafka/start.sh:/scripts/start.sh:ro
      # named volume：Docker 管理的儲存區，容器刪掉資料還在，docker compose down -v 才會清掉。
      # 裡面有 topic 資料、KRaft metadata（SCRAM 帳號、ACL）、consumer group 的 committed offset。
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 實際使用 admin 帳密經 SCRAM 登入 Kafka，並執行 Kafka protocol 請求；
      # 成功後才判定 broker healthy。這會驗證連線與認證，但不完整驗證一般使用者的 ACL。
      # CMD-SHELL：用 /bin/sh -c 執行，可以使用重新導向；exit 0 = 健康。
      # /tmp/admin.properties 由 start.sh 產生，只存在容器內。
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /tmp/admin.properties > /dev/null 2>&1"]
      # 每 10 秒檢查一次
      interval: 10s
      # 單次檢查超過 30 秒算失敗。Kafka CLI 每次都要啟動一個 JVM，很慢，所以給得比 redis 寬。
      timeout: 30s
      # 連續失敗 12 次才標成 unhealthy
      retries: 12
      # 啟動後前 20 秒的失敗不計入 retries（broker 還在 format、選 controller）。
      # 最久約 20 + 12 × 10 = 140 秒才會判定 unhealthy。
      start_period: 20s

  kafka-init:
    # 同一個 image，只為了使用裡面的命令列工具（kafka-configs / kafka-topics / kafka-acls）
    image: *kafka-image
    entrypoint: ["bash", "/scripts/init.sh"]
    environment:
      # admin 用來登入並執行管理操作
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?請先執行 cp .env.example .env}
      # 這兩個密碼用來「建立」producer / consumer 帳號（init.sh step 1）
      KAFKA_PRODUCER_PASSWORD: ${KAFKA_PRODUCER_PASSWORD:?請先執行 cp .env.example .env}
      KAFKA_CONSUMER_PASSWORD: ${KAFKA_CONSUMER_PASSWORD:?請先執行 cp .env.example .env}
      # init.sh step 2：topic 名稱與 partition 數。
      # "3" 要加引號：環境變數必須是字串，YAML 不加引號會被當成數字。
      KAFKA_TOPIC: orders
      KAFKA_TOPIC_PARTITIONS: "3"
      # init.sh step 3：consumer 帳號唯一被允許使用的 group，必須與 consumer 的 KAFKA_GROUP_ID 一致
      KAFKA_CONSUMER_GROUP: order-consumers
    # 只掛腳本，不掛 volume：kafka-init 自己不存任何資料，結果都透過網路寫進 kafka 的 metadata
    volumes:
      - ./infra/kafka/init.sh:/scripts/init.sh:ro
    depends_on:
      kafka:
        # 等 kafka 的 healthcheck 通過（admin 能登入）才開始，否則建帳號會連不上
        condition: service_healthy
    # 一次性工作，跑完就結束，不重啟。成功時狀態是 Exited (0)。
    # 其他服務以 service_completed_successfully 等它，它就是啟動的閘門。
    restart: "no"

  # ---------- Producer ----------
  producer:
    # 用 ./producer/Dockerfile 建 image（程式改過要 docker compose up -d --build）
    build: ./producer
    # client 端設定，每個值都要與 server 端（start.sh / init.sh）對得上：
    environment:
      # → start.sh 的 INTERNAL listener
      KAFKA_BROKERS: kafka:9092
      # → init.sh step 1 建的帳號；ACL 只有 topic orders 的 Write、Describe
      KAFKA_USERNAME: producer
      KAFKA_PASSWORD: ${KAFKA_PRODUCER_PASSWORD:?請先執行 cp .env.example .env}
      # → init.sh step 2 建的 topic（auto.create.topics.enable=false，打錯名稱會直接報錯）
      KAFKA_TOPIC: orders
      # 每 1000 毫秒送 1 筆事件
      PRODUCE_INTERVAL_MS: "1000"
      # 同時維持 5 張進行中的訂單，每張 created → paid → shipped → delivered
      ACTIVE_ORDERS: "5"
    depends_on:
      kafka-init:
        # 等 kafka-init 結束且 exit 0（帳號、topic、ACL 都建好）才啟動
        condition: service_completed_successfully
    # 程序退出就重啟（例如重試用盡後 exit(1)），除非是手動 docker compose stop 的。
    # 也包含 Docker daemon 重啟（主機重開機）後自動啟動。
    restart: unless-stopped

  # ---------- Consumer × 2（同一個 Consumer Group）----------
  consumer:
    build: ./consumer
    deploy:
      # 起 2 個一模一樣的容器（consumer-1、consumer-2），所以不能寫 container_name（不能同名）。
      # 執行中可用 docker compose up -d --scale consumer=N 調整；超過 partition 數（3）的會閒置。
      replicas: 2   # 兩個實體共用 group order-consumers，Kafka 自動分配 partition
    environment:
      # ----- Kafka client 端 -----
      KAFKA_BROKERS: kafka:9092
      # → init.sh step 1 建的帳號；ACL 只有 topic orders 的 Read、Describe 與 group 的 Read
      KAFKA_USERNAME: consumer
      KAFKA_PASSWORD: ${KAFKA_CONSUMER_PASSWORD:?請先執行 cp .env.example .env}
      KAFKA_TOPIC: orders
      # 必須與 kafka-init 的 KAFKA_CONSUMER_GROUP 完全一致：
      # 打錯一個字，帳密都對也會在加入 group 時得到 GroupAuthorizationException
      KAFKA_GROUP_ID: order-consumers
      # ----- Redis client 端 -----
      # redis 是服務名稱，6379 是容器內的 port（不受 REDIS_HOST_PORT 影響）
      REDIS_URL: redis://redis:6379
      # → entrypoint.sh 的 user app：只能碰 myapp:*，指令白名單
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_APP_PASSWORD:?請先執行 cp .env.example .env}
      # → entrypoint.sh 的 ~myapp:*。改成其他前綴，寫入會得到 NOPERM
      REDIS_KEY_PREFIX: myapp
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        # 等 redis healthcheck 通過（ACL 檔已產生、admin 能登入）
        condition: service_healthy
    restart: unless-stopped

  # ---------- 權限申請面板 ----------
  # 整個系統唯一持有 Kafka / Redis admin 憑證的元件
  web:
    build: ./web
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # Kafka admin：用 kafka-configs.sh 建 SCRAM 帳號、用 kafkajs 建 ACL
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?請先執行 cp .env.example .env}
      # 申請的帳號只會拿到這個 topic 的 READ、DESCRIBE
      KAFKA_TOPIC: orders
      REDIS_URL: redis://redis:6379
      # Redis admin：用 ACL SETUSER + ACL SAVE 建帳號
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?請先執行 cp .env.example .env}
      # 申請的帳號只能讀這個前綴底下的 key
      REDIS_KEY_PREFIX: myapp
    ports:
      # 只綁 127.0.0.1；從其他電腦開面板要用 SSH tunnel
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"   # host 上 8080 被占用時，在 .env 改 WEB_HOST_PORT
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # 打自己的 /healthz，HTTP 有回應就算健康（wget 失敗會回傳非 0）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- 管理 UI（選用，profile: ui）----------
  # profiles：只有加上 --profile ui 才會啟動，平常 docker compose up 不會帶起來。
  #   啟動：docker compose --profile ui up -d
  #   停止：docker compose --profile ui stop kafbat-ui redisinsight
  # 兩個 UI 都用 admin 帳號連線（看得到、改得了全部），所以 port 一樣只綁 127.0.0.1。
  # 從其他電腦開要用 SSH tunnel（把 port 換成下面的 host port）。

  kafbat-ui:
    # Kafbat UI：provectus/kafka-ui 停止維護後的社群接手版本
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    profiles: ["ui"]
    environment:
      # KAFKA_CLUSTERS_<編號>_...：可設定多個 cluster，這裡只有一個（編號 0）
      # UI 左側顯示的 cluster 名稱
      KAFKA_CLUSTERS_0_NAME: kafka-redis-lab
      # → start.sh 的 INTERNAL listener（UI 在 compose 網路內，所以用 kafka:9092 而不是 localhost:9094）
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # _PROPERTIES_ 之後的部分會轉成 Kafka client 設定：
      #   SECURITY_PROTOCOL → security.protocol，SASL_MECHANISM → sasl.mechanism，以此類推
      # 與 start.sh 的 INTERNAL listener 一致：SASL 認證、不加密、SCRAM-SHA-512
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      # 用 admin 登入：才看得到全部 topic、consumer group、ACL。
      # 若改用 producer / consumer 帳號，UI 只會看到 ACL 允許的部分（可拿來觀察 ACL 效果）。
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:?請先執行 cp .env.example .env}";
      # 關掉「在 UI 裡新增 / 修改 cluster 設定」，設定只來自這裡的環境變數
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      # UI 容器內聽 8080，與 web 面板撞號，所以 host 端預設改用 8081
      - "127.0.0.1:${KAFBAT_HOST_PORT:-8081}:8080"
    depends_on:
      kafka-init:
        # 等帳號、topic、ACL 都建好再啟動，一打開就看得到 orders topic
        condition: service_completed_successfully
    restart: unless-stopped

  redisinsight:
    # Redis 官方的 GUI（瀏覽 key、看 TTL、跑指令的 Workbench）
    image: redis/redisinsight:latest
    profiles: ["ui"]
    environment:
      # 預先登錄一個資料庫連線，打開 UI 就在清單裡，不用手動輸入。
      # 注意：這些變數拿掉後重啟，預先登錄的連線也會一起被移除。
      # redis 是服務名稱，6379 是容器內 port（不受 REDIS_HOST_PORT 影響）
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: kafka-redis-lab (admin)
      # 用 admin：Insight 的 key 瀏覽器靠 SCAN、TYPE、INFO 等指令，
      # app 帳號是白名單（沒有 SCAN），用 app 會連得上但列不出 key。
      RI_REDIS_USERNAME: admin
      RI_REDIS_PASSWORD: ${REDIS_ADMIN_PASSWORD:?請先執行 cp .env.example .env}
    ports:
      # Redis Insight 容器內固定聽 5540
      - "127.0.0.1:${REDISINSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      # UI 自己的設定（連線清單、Workbench 歷史），重啟後仍在
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    # alpine 版本：沒有 bash，所以 entrypoint.sh 只能用 POSIX sh
    image: redis:7.4-alpine
    # 先由 entrypoint.sh 從環境變數產生 ACL 檔，再交回官方的 docker-entrypoint.sh 啟動 redis-server
    entrypoint: ["sh", "/scripts/entrypoint.sh"]
    environment:
      # 兩個密碼以 SHA-256 雜湊寫進 /data/users.acl，ACL 檔不存明文
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?請先執行 cp .env.example .env}
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:?請先執行 cp .env.example .env}
      # redis-cli 會自動讀這個環境變數當密碼：healthcheck 與 docker compose exec redis redis-cli --user admin
      # 都不用在指令列帶 --pass，ps 也看不到密碼。
      REDISCLI_AUTH: ${REDIS_ADMIN_PASSWORD}   # 給 healthcheck 的 redis-cli 用，避免密碼出現在指令列
    # 沒有設定 restart（預設 "no"）：主機重開機後不會自動啟動，要手動 docker compose up -d。
    ports:
      # 只綁 127.0.0.1；host port 可用 .env 改，容器內固定 6379，容器之間仍用 redis:6379
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"   # host 上 6379 被占用時，在 .env 改 REDIS_HOST_PORT
    volumes:
      - ./infra/redis/entrypoint.sh:/scripts/entrypoint.sh:ro
      # ACL 檔（users.acl，含面板建立的帳號）與 AOF 資料都在這裡，重啟後仍在
      - redis-data:/data
    healthcheck:
      # 用 admin 登入 ping，回 PONG 才算健康（同時驗證 ACL 檔產生正確、admin 密碼正確）
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user admin ping | grep -q PONG"]
      # Redis 啟動很快，檢查也很輕，所以間隔與 timeout 都比 kafka 短
      interval: 5s
      timeout: 3s
      retries: 10

# named volume 宣告。實際名稱會加上專案前綴：kafka-redis-lab_kafka-data、kafka-redis-lab_redis-data。
# docker compose down 保留它們；down -v 才刪除（Kafka 帳號、ACL、topic 資料、Redis 資料全部歸零）。
volumes:
  kafka-data:
  redis-data:
  # Redis Insight 的設定（只有 --profile ui 時才會用到）
  redisinsight-data:
